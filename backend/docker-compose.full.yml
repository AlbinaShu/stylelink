services:
  postgres:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stylelink -d stylelink"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
    env_file:
      - ${STYLELINK_BACKEND_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://stylelink:stylelink@postgres:5432/stylelink
      FASHION_CLIP_URL: http://ml:8001
      SIZE_SHIFT_URL: http://ml:8001
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
